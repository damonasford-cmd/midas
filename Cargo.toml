[workspace]
resolver = "2"

members = [
    "coeur",
    "model_gateway",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
authors = ["Damon"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
