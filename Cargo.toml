[workspace]
resolver = "2"
members = ["core"]

[workspace.package]
version = "0.6.0"
edition = "2021"
authors = ["Damon"]
license = "Proprietary"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
